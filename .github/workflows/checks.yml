name: CPU checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Check Transformers model interfaces
        run: python -c "from transformers import AutoProcessor, Qwen3_5ForConditionalGeneration"
      - name: Check formatting
        run: python -m black --check train_dreamrealm.py dreamrealm scripts tests
      - name: Compile Python modules
        run: python -m compileall -q train_dreamrealm.py dreamrealm scripts tests
      - name: Run correctness tests
        run: python -m unittest discover -s tests -v
      - name: Run smoke test
        run: python scripts/local_smoke.py
